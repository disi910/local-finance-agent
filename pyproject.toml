[project]
name = "local-finance-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Didrik Sivertsen", email = "didrik2004@icloud.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.6",
    "fastapi>=0.142.2",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pydantic>=2.13.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
local-finance-agent = "local_finance_agent:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-socket>=0.8.1",
]

[tool.pytest.ini_options]
addopts = "--disable-socket"
testpaths = ["tests"]